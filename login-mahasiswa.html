<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Mahasiswa - Lost &amp; Found FILKOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5" style="max-width: 560px;">
        <div class="mb-3">
          <a href="pilih-peran.html" class="link-kembali d-block mb-3">&larr; Pilih peran lain</a>
          <span class="badge-peran">Mahasiswa</span>
        </div>

        <div class="panel-biru p-4 p-md-5 mt-4">
          <h3 class="fw-bold text-white mb-4">Login Mahasiswa</h3>
          <form id="formLoginMahasiswa">
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-color: #9a9a9a; border-radius: 8px 0 0 8px;">
                  <i class="bi bi-envelope text-secondary"></i>
                </span>
                <input type="email" class="form-control input-lf border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="mahasiswa@gmail.com" value="mahasiswa@gmail.com" required />
              </div>
            </div>
            <div class="mb-4">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-color: #9a9a9a; border-radius: 8px 0 0 8px;">
                  <i class="bi bi-lock text-secondary"></i>
                </span>
                <input type="password" class="form-control input-lf border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="........" value="12345678" required />
              </div>
            </div>
            <button type="submit" class="btn btn-biru w-100 py-2">Login</button>
          </form>

          <div class="d-flex align-items-center gap-3 my-4 text-white small">
            <hr class="flex-grow-1 border-white opacity-100" />
            <span class="fw-semibold">Atau</span>
            <hr class="flex-grow-1 border-white opacity-100" />
          </div>

          <a href="dashboard-mahasiswa.html" class="btn btn-ub w-100 py-2">Masuk dengan Akun UB</a>
        </div>

        <div class="text-center mt-4">
          <a href="login-satpam.html" class="text-dark small fw-medium">Login sebagai Satpam?</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
