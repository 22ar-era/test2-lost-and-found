<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Lapor Temuan - Lost &amp; Found FILKOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar-utama sticky-top">
    <nav class="navbar navbar-expand-lg py-3">
      <div class="container">
        <a href="dashboard-mahasiswa.html" class="logo-brand">
          <span>Lost &amp; Found</span>
          <span><span class="logo-fil">FIL</span><span class="logo-kom">KOM</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuMhs">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuMhs">
          <div class="d-flex flex-wrap justify-content-center gap-2 mx-auto my-2 my-lg-0">
            <a href="dashboard-mahasiswa.html" class="tombol-nav">Dashboard</a>
            <a href="lapor-kehilangan.html" class="tombol-nav">Lapor Kehilangan</a>
            <a href="lapor-temuan.html" class="tombol-nav active">Lapor Temuan</a>
            <a href="daftar-barang.html" class="tombol-nav">Cari Barang</a>
            <a href="status-klaim.html" class="tombol-nav">Status Klaim</a>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="badge-peran">Mahasiswa</span>
            <span class="lingkaran-profil"></span>
            <a href="index.html" class="text-dark text-decoration-none fw-bold small">Keluar</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="mx-auto" style="max-width: 900px;">
      <h2 class="fw-bold mb-4">Form Lapor Temuan</h2>
      <div class="panel-biru p-4 p-md-5">
        <form id="formLaporTemuan">
          <div class="mb-3">
            <label class="form-label text-white small fw-medium">Foto Barang Temuan *</label>
            <label class="kotak-upload d-block" for="inputFoto">
              <i class="bi bi-image fs-4 d-block mb-1"></i>
              <span class="small" id="labelFoto">Unggah foto</span>
              <input type="file" id="inputFoto" class="d-none" accept="image/*" />
            </label>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-white small fw-medium">Nama Barang *</label>
              <input type="text" class="form-control input-lf" placeholder="cth. Payung lipat hitam" required />
            </div>
            <div class="col-md-6">
              <label class="form-label text-white small fw-medium">Kategori *</label>
              <select class="form-select input-lf" required>
                <option value="">Pilih kategori</option>
                <option value="Elektronik">Elektronik</option>
                <option value="Aksesoris">Aksesoris</option>
                <option value="Alat Minum">Alat Minum</option>
                <option value="Alat Tulis">Alat Tulis</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-white small fw-medium">Deskripsi</label>
            <textarea class="form-control input-lf" rows="4" placeholder="Deskripsi singkat barang..." required></textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-white small fw-medium">Lokasi &amp; Waktu Penemuan *</label>
              <input type="text" class="form-control input-lf" placeholder="cth. Perpustakaan, 10/11 14:20" required />
            </div>
            <div class="col-md-6">
              <label class="form-label text-white small fw-medium">Tempat Barang Dititipkan *</label>
              <input type="text" class="form-control input-lf" placeholder="cth. Resepsionis Gedung A" required />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3">
            <a href="dashboard-mahasiswa.html" class="btn btn-putih px-4">Batal</a>
            <button type="submit" class="btn btn-biru px-4">Kirim Laporan</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
