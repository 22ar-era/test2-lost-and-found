<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajukan Klaim - Lost &amp; Found FILKOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar-utama sticky-top">
    <nav class="navbar py-3">
      <div class="container">
        <a href="dashboard-mahasiswa.html" class="logo-brand">
          <span>Lost &amp; Found</span>
          <span><span class="logo-fil">FIL</span><span class="logo-kom">KOM</span></span>
        </a>
        <div class="d-flex align-items-center gap-3">
          <span class="badge-peran">Mahasiswa</span>
          <span class="lingkaran-profil"></span>
          <a href="index.html" class="text-dark text-decoration-none fw-bold small">Keluar</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="mx-auto" style="max-width: 660px;">
      <h2 class="fw-bold mb-4">Ajukan Klaim</h2>

      <div class="panel-biru p-3 mb-4 d-flex align-items-center gap-3">
        <div class="thumb-kotak"><img src="assets/helm.png" alt="Helm" /></div>
        <div>
          <div class="fw-bold text-white">Helm</div>
          <div class="small text-white" style="opacity: 0.92;">Junction - 23 November 2026</div>
        </div>
      </div>

      <form id="formAjukanKlaim">
        <h6 class="fw-bold mb-1">Pertanyaan Verifikasi</h6>
        <p class="text-secondary small mb-3">Jelaskan ciri khusus barang ini untuk membuktikan kepemilikan</p>
        <textarea class="form-control input-lf mb-5" rows="5" placeholder="Tuliskan jawaban kamu di sini..." required></textarea>

        <div class="d-flex justify-content-end gap-3">
          <a href="detail-barang.html" class="btn btn-putih px-4">Batal</a>
          <button type="submit" class="btn btn-biru px-4">Kirim Klaim</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
